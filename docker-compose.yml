services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: koprik_xarita
      POSTGRES_USER: koprik
      POSTGRES_PASSWORD: koprik
    ports:
      - "5432:5432"
    volumes:
      - koprik_map_db:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U koprik -d koprik_xarita"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  koprik_map_db:
